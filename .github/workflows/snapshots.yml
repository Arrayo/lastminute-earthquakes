name: Generate Snapshots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Skip if last commit is snapshot
        run: |
          LAST_MSG=$(git log -1 --format=%s)
          if echo "$LAST_MSG" | grep -q "\[snapshots\]"; then
            echo "Last commit is a snapshot commit. Exiting."
            exit 0
          fi
          echo "SHOULD_RUN=true" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: env.SHOULD_RUN == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: npm ci

      - name: Generate snapshots
        if: env.SHOULD_RUN == 'true'
        run: npm run snapshots:generate

      - name: Commit and push
        if: env.SHOULD_RUN == 'true'
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update earthquake snapshots [snapshots]"
            git push
          fi
